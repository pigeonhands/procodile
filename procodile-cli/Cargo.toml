[package]
name = "procodile-cli"
version.workspace = true
edition.workspace = true

[features]
default = ["sqlite"]
# Pointer databases (`pointer open`); needs a C compiler for the bundled SQLite.
sqlite = ["dep:rusqlite"]

[dependencies]
clap = { version = "4.5.58", features = ["derive"] }
ctrlc = "3.5.2"
procodile = { path = "../procodile" }
ratatui = "0.30.2"
rusqlite = { version = "0.41.0", features = ["bundled"], optional = true }
rustyline = "17.0.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"

[[bin]]
name = "procodile"   # This is the name of the actual executable
path = "src/main.rs"
