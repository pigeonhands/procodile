[package]
name = "procodile"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Cross-platform process memory primitives: regions, modules, value and pointer scanning, structs, freezing"
readme = "README.md"
keywords = ["memory", "process", "scanner", "cheat-engine", "reverse-engineering"]
categories = ["development-tools::debugging", "os"]

[dependencies]
thiserror = "2.0.18"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [ 
    "Win32_System_WindowsProgramming", 
    "Win32_System_SystemInformation",  
    "Wdk_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_ProcessStatus",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_ToolHelp"
] }
